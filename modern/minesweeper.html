<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #board { display: grid; grid-template-columns: repeat(8, 40px); gap: 2px; max-width: 340px; margin: 20px auto; background: #999; padding: 2px; }
        .cell { width: 40px; height: 40px; background: #ddd; border: 2px solid #666; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; }
        .cell.revealed { background: #fff; border: 1px solid #ccc; }
        .cell.mine { background: #ff4444; }
        .cell.flagged { background: #ffcc00; }
        #info { font-size: 20px; margin: 20px 0; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #flag-btn { padding: 12px 24px; font-size: 18px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #flag-btn.on { background: #000; color: #fff; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 id="t">Сапер</h1>
    <p id="d">Натисніть на клітинку. Довге натискання - прапорець.</p>
    
    <div id="info">Мін залишилось: 10</div>
    <button id="flag-btn" onclick="toggleFlagMode()">Прапорець: вимкнено</button>
    <div id="board"></div>
    
    <button id="new-game" onclick="initGame()">Нова гра</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        const L={
            en:{t:"Minesweeper",d:"Tap a cell to open it. Turn on flag mode, then tap to place a flag.",mines:"Mines left",win:"You won!",lose:"You lost!",wins:"Wins",flagOn:"Flag mode: ON",flagOff:"Flag mode: OFF",bn:"New Game",bb:"Menu"},
            uk:{t:"Сапер",d:"Натисніть на клітинку, щоб відкрити. Увімкніть режим прапорця, потім тисніть, щоб поставити.",mines:"Мін залишилось",win:"Ви виграли!",lose:"Ви програли!",wins:"Перемог",flagOn:"Прапорець: увімкнено",flagOff:"Прапорець: вимкнено",bn:"Нова гра",bb:"До меню"},
            de:{t:"Minesweeper",d:"Tippe eine Zelle zum Öffnen an. Schalte den Flaggen-Modus ein und tippe zum Setzen.",mines:"Minen übrig",win:"Gewonnen!",lose:"Verloren!",wins:"Siege",flagOn:"Flaggen-Modus: AN",flagOff:"Flaggen-Modus: AUS",bn:"Neues Spiel",bb:"Menü"},
            pl:{t:"Saper",d:"Kliknij pole, aby je otworzyć. Włącz tryb flagi, potem klikaj, aby postawić flagę.",mines:"Pozostało min",win:"Wygrałeś!",lose:"Przegrałeś!",wins:"Zwycięstwa",flagOn:"Tryb flagi: WŁ",flagOff:"Tryb flagi: WYŁ",bn:"Nowa gra",bb:"Menu"}
        };
        let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
        document.documentElement.lang=lang;
        document.getElementById('t').textContent=L[lang].t;
        document.getElementById('d').textContent=L[lang].d;
        document.getElementById('new-game').textContent=L[lang].bn;
        document.getElementById('back-btn').textContent=L[lang].bb;

        function bump(key) {
            localStorage.setItem(key, '' + (+(localStorage.getItem(key) || 0) + 1));
        }

        const SIZE = 8;
        const MINES = 10;
        let board, revealed, flagged, gameOver, minesLeft, flagMode = false;

        function updateFlagButton() {
            const btn = document.getElementById('flag-btn');
            btn.textContent = flagMode ? L[lang].flagOn : L[lang].flagOff;
            btn.className = flagMode ? 'on' : '';
        }

        function toggleFlagMode() {
            flagMode = !flagMode;
            updateFlagButton();
        }

        function clickCell(r, c) {
            if (flagMode) toggleFlag(r, c); else revealCell(r, c);
        }

        function initGame() {
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
            revealed = Array(SIZE).fill(null).map(() => Array(SIZE).fill(false));
            flagged = Array(SIZE).fill(null).map(() => Array(SIZE).fill(false));
            gameOver = false;
            flagMode = false;
            updateFlagButton();
            minesLeft = MINES;
            
            // Розміщуємо міни
            let placed = 0;
            while (placed < MINES) {
                const r = Math.floor(Math.random() * SIZE);
                const c = Math.floor(Math.random() * SIZE);
                if (board[r][c] !== -1) {
                    board[r][c] = -1;
                    placed++;
                }
            }
            
            // Рахуємо числа
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === -1) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === -1) {
                                count++;
                            }
                        }
                    }
                    board[r][c] = count;
                }
            }
            
            updateDisplay();
        }

        function updateDisplay() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            document.getElementById('info').textContent = L[lang].mines + ': ' + minesLeft;
            
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (revealed[r][c]) {
                        cell.classList.add('revealed');
                        if (board[r][c] === -1) {
                            cell.classList.add('mine');
                            cell.textContent = '*';
                        } else if (board[r][c] > 0) {
                            cell.textContent = board[r][c];
                        }
                    } else if (flagged[r][c]) {
                        cell.classList.add('flagged');
                        cell.textContent = 'F';
                    }
                    
                    cell.onclick = () => clickCell(r, c);
                    cell.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
                    boardEl.appendChild(cell);
                }
            }
        }

        function revealCell(r, c) {
            if (gameOver || revealed[r][c] || flagged[r][c]) return;
            
            if (board[r][c] === -1) {
                // Вибух!
                for (let i = 0; i < SIZE; i++) {
                    for (let j = 0; j < SIZE; j++) {
                        if (board[i][j] === -1) revealed[i][j] = true;
                    }
                }
                gameOver = true;
                bump('stats_ms_games');
                document.getElementById('info').textContent = L[lang].lose;
            } else {
                reveal(r, c);
                checkWin();
            }
            updateDisplay();
        }

        function reveal(r, c) {
            if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
            if (revealed[r][c] || flagged[r][c]) return;
            
            revealed[r][c] = true;
            
            if (board[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        reveal(r + dr, c + dc);
                    }
                }
            }
        }

        function toggleFlag(r, c) {
            if (gameOver || revealed[r][c]) return;
            flagged[r][c] = !flagged[r][c];
            minesLeft += flagged[r][c] ? -1 : 1;
            updateDisplay();
        }

        function checkWin() {
            let revealedCount = 0;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (revealed[r][c]) revealedCount++;
                }
            }
            if (revealedCount === SIZE * SIZE - MINES) {
                gameOver = true;
                bump('stats_ms_wins');
                bump('stats_ms_games');
                document.getElementById('info').textContent = L[lang].win + ' | ' + L[lang].wins + ': ' + localStorage.getItem('stats_ms_wins');
            }
        }

        initGame();
    </script>
</body>
</html>
