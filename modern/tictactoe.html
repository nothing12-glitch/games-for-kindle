<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрестики-нулики</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #board { display: grid; grid-template-columns: repeat(3, 80px); gap: 5px; max-width: 260px; margin: 30px auto; }
        .cell { width: 80px; height: 80px; background: #fff; border: 3px solid #000; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; cursor: pointer; }
        .cell:active { background: #eee; }
        #status { font-size: 24px; margin: 20px 0; min-height: 30px; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 id="t">Хрестики-нулики</h1>
    <p id="d">Ви граєте за X. Комп'ютер грає за O.</p>
    
    <div id="status">Ваш хід</div>
    <div id="board"></div>
    
    <button id="new-game" onclick="initGame()">Нова гра</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        const L={
            en:{t:"Tic-Tac-Toe",d:"You play X. The computer plays O.",your:"Your turn",ai:"Computer is thinking...",win:"You won!",lose:"Computer won!",draw:"Draw!",bn:"New Game",bb:"Menu"},
            uk:{t:"Хрестики-нулики",d:"Ви граєте за X. Комп'ютер грає за O.",your:"Ваш хід",ai:"Хід комп'ютера...",win:"Ви виграли!",lose:"Комп'ютер виграв!",draw:"Нічия!",bn:"Нова гра",bb:"До меню"},
            de:{t:"Tic-Tac-Toe",d:"Du spielst X. Der Computer spielt O.",your:"Du bist dran",ai:"Computer denkt...",win:"Du hast gewonnen!",lose:"Computer hat gewonnen!",draw:"Unentschieden!",bn:"Neues Spiel",bb:"Menü"},
            pl:{t:"Kółko i krzyżyk",d:"Grasz X. Komputer gra O.",your:"Twój ruch",ai:"Ruch komputera...",win:"Wygrałeś!",lose:"Komputer wygrał!",draw:"Remis!",bn:"Nowa gra",bb:"Menu"}
        };
        let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
        document.documentElement.lang=lang;
        document.getElementById('t').textContent=L[lang].t;
        document.getElementById('d').textContent=L[lang].d;
        document.getElementById('new-game').textContent=L[lang].bn;
        document.getElementById('back-btn').textContent=L[lang].bb;

        let board, currentPlayer, gameOver;

        function initGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameOver = false;
            document.getElementById('status').textContent = L[lang].your;
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = board[i];
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            }
        }

        function makeMove(index) {
            if (gameOver || board[index] || currentPlayer !== 'X') return;
            
            board[index] = 'X';
            renderBoard();
            
            if (checkWin('X')) {
                document.getElementById('status').textContent = L[lang].win;
                gameOver = true;
                return;
            }
            
            if (board.every(cell => cell)) {
                document.getElementById('status').textContent = L[lang].draw;
                gameOver = true;
                return;
            }
            
            currentPlayer = 'O';
            document.getElementById('status').textContent = L[lang].ai;
            setTimeout(computerMove, 500);
        }

        function computerMove() {
            if (gameOver) return;
            
            // Простий AI: випадковий хід
            let available = board.map((cell, i) => cell === '' ? i : null).filter(i => i !== null);
            let move = available[Math.floor(Math.random() * available.length)];
            
            board[move] = 'O';
            renderBoard();
            
            if (checkWin('O')) {
                document.getElementById('status').textContent = L[lang].lose;
                gameOver = true;
                return;
            }
            
            if (board.every(cell => cell)) {
                document.getElementById('status').textContent = L[lang].draw;
                gameOver = true;
                return;
            }
            
            currentPlayer = 'X';
            document.getElementById('status').textContent = L[lang].your;
        }

        function checkWin(player) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(([a,b,c]) => board[a] === player && board[b] === player && board[c] === player);
        }

        initGame();
    </script>
</body>
</html>
