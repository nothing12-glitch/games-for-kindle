<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест на реакцію</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #game-area { width: 100%; max-width: 400px; height: 300px; margin: 30px auto; border: 3px solid #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; user-select: none; }
        #game-area.waiting { background: #ff4444; color: #fff; }
        #game-area.ready { background: #44ff44; color: #000; }
        #game-area.result { background: #fff; color: #000; }
        #best-time { font-size: 20px; margin: 20px 0; color: #666; }
        #attempts { font-size: 20px; margin: 20px 0; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 id="t">Тест на реакцію</h1>
    <p id="d">Натисніть, коли екран стане зеленим!</p>
    
    <div id="best-time">Найкращий час: -</div>
    <div id="attempts">Спроб: 0</div>
    
    <div id="game-area" class="result" onclick="handleClick()">
        Натисніть, щоб почати
    </div>
    
    <button id="new-game" onclick="resetGame()">Скинути результат</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        const L={
            en:{t:"Reaction Test",d:"Tap when the screen turns green!",best:"Best time",attempts:"Attempts",start:"Tap to start",wait:"Wait for green...",go:"TAP!",early:"Too early! Tap to try again.",result:"{n} ms<br><br>Tap to try again",reset:"Reset results",bb:"Menu",ms:"ms"},
            uk:{t:"Тест на реакцію",d:"Натисніть, коли екран стане зеленим!",best:"Найкращий час",attempts:"Спроб",start:"Натисніть, щоб почати",wait:"Чекайте на зелений...",go:"НАТИСНІТЬ!",early:"Занадто рано! Натисніть, щоб спробувати ще.",result:"{n} мс<br><br>Натисніть, щоб спробувати ще",reset:"Скинути результат",bb:"До меню",ms:"мс"},
            de:{t:"Reaktionstest",d:"Tippe, wenn der Bildschirm grün wird!",best:"Bestzeit",attempts:"Versuche",start:"Tippen zum Starten",wait:"Warte auf Grün...",go:"TIPPEN!",early:"Zu früh! Tippe für einen neuen Versuch.",result:"{n} ms<br><br>Tippe für einen neuen Versuch",reset:"Ergebnisse zurücksetzen",bb:"Menü",ms:"ms"},
            pl:{t:"Test reakcji",d:"Kliknij, gdy ekran zrobi się zielony!",best:"Najlepszy czas",attempts:"Prób",start:"Kliknij, aby zacząć",wait:"Czekaj na zielony...",go:"KLIKNIJ!",early:"Za wcześnie! Kliknij, aby spróbować ponownie.",result:"{n} ms<br><br>Kliknij, aby spróbować ponownie",reset:"Zresetuj wyniki",bb:"Menu",ms:"ms"}
        };
        let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
        document.documentElement.lang=lang;
        document.getElementById('t').textContent=L[lang].t;
        document.getElementById('d').textContent=L[lang].d;
        document.getElementById('new-game').textContent=L[lang].reset;
        document.getElementById('back-btn').textContent=L[lang].bb;
        document.getElementById('game-area').textContent=L[lang].start;
        document.getElementById('best-time').textContent=L[lang].best+': '+(localStorage.getItem('best_reaction')?localStorage.getItem('best_reaction')+' '+L[lang].ms:'-');
        document.getElementById('attempts').textContent=L[lang].attempts+': 0';

        const gameArea = document.getElementById('game-area');
        let state = 'idle';
        let startTime;
        let timeoutId;
        let bestTime = +(localStorage.getItem('best_reaction') || 0) || Infinity;
        let attempts = 0;
        let times = [];

        function handleClick() {
            if (state === 'idle') {
                startGame();
            } else if (state === 'waiting') {
                tooEarly();
            } else if (state === 'ready') {
                recordTime();
            } else if (state === 'result') {
                startGame();
            }
        }

        function startGame() {
            state = 'waiting';
            gameArea.className = 'waiting';
            gameArea.textContent = L[lang].wait;
            
            const delay = 1000 + Math.random() * 4000;
            timeoutId = setTimeout(() => {
                state = 'ready';
                gameArea.className = 'ready';
                gameArea.textContent = L[lang].go;
                startTime = Date.now();
            }, delay);
        }

        function tooEarly() {
            clearTimeout(timeoutId);
            state = 'result';
            gameArea.className = 'result';
            gameArea.textContent = L[lang].early;
        }

        function recordTime() {
            const reactionTime = Date.now() - startTime;
            times.push(reactionTime);
            attempts++;
            
            if (reactionTime < bestTime) {
                bestTime = reactionTime;
                localStorage.setItem('best_reaction', '' + reactionTime);
                document.getElementById('best-time').textContent = L[lang].best + ': ' + bestTime + ' ' + L[lang].ms;
            }
            
            document.getElementById('attempts').textContent = L[lang].attempts + ': ' + attempts;
            
            state = 'result';
            gameArea.className = 'result';
            gameArea.innerHTML = L[lang].result.replace('{n}', reactionTime);
        }

        function resetGame() {
            clearTimeout(timeoutId);
            state = 'idle';
            bestTime = +(localStorage.getItem('best_reaction') || 0) || Infinity;
            attempts = 0;
            times = [];
            gameArea.className = 'result';
            gameArea.textContent = L[lang].start;
            document.getElementById('best-time').textContent = L[lang].best + ': ' + (bestTime === Infinity ? '-' : bestTime + ' ' + L[lang].ms);
            document.getElementById('attempts').textContent = L[lang].attempts + ': 0';
        }
    </script>
</body>
</html>
