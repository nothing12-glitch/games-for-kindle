<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судоку для Kindle</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; color: #000; }
        h1 { font-size: 28px; }
        
        /* Сітка Судоку */
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 2px;
            max-width: 400px;
            margin: 20px auto;
            background: #000;
            border: 3px solid #000;
        }
        
        .cell {
            aspect-ratio: 1;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
        }
        
        /* Товстіші лінії для блоків 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid #000; }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #000; }

        .cell.fixed { background: #e0e0e0; color: #000; }
        .cell.selected { background: #ffff00; }
        .cell.error { background: #ffcccc; }

        /* Клавіатура для Kindle */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 20px auto;
        }
        
        .num-btn {
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            background: #fff;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
        }
        .num-btn:active { background: #000; color: #fff; }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #ddd;
            border: 2px solid #000;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>🔢 Судоку</h1>
    <p>Натисніть на клітинку, потім оберіть цифру.</p>

    <div class="sudoku-board" id="board"></div>

    <div class="numpad">
        <button class="num-btn" onclick="inputNumber(1)">1</button>
        <button class="num-btn" onclick="inputNumber(2)">2</button>
        <button class="num-btn" onclick="inputNumber(3)">3</button>
        <button class="num-btn" onclick="inputNumber(4)">4</button>
        <button class="num-btn" onclick="inputNumber(5)">5</button>
        <button class="num-btn" onclick="inputNumber(6)">6</button>
        <button class="num-btn" onclick="inputNumber(7)">7</button>
        <button class="num-btn" onclick="inputNumber(8)">8</button>
        <button class="num-btn" onclick="inputNumber(9)">9</button>
        <button class="num-btn" onclick="inputNumber('C')" style="color:red;">X</button>
    </div>

    <a href="index.html" class="back-btn">← До меню</a>

    <script>
        // Проста демо-сітка (0 = порожньо)
        const initialBoard = [
            5, 3, 0, 0, 7, 0, 0, 0, 0,
            6, 0, 0, 1, 9, 5, 0, 0, 0,
            0, 9, 8, 0, 0, 0, 0, 6, 0,
            8, 0, 0, 0, 6, 0, 0, 0, 3,
            4, 0, 0, 8, 0, 3, 0, 0, 1,
            7, 0, 0, 0, 2, 0, 0, 0, 6,
            0, 6, 0, 0, 0, 0, 2, 8, 0,
            0, 0, 0, 4, 1, 9, 0, 0, 5,
            0, 0, 0, 0, 8, 0, 0, 7, 9
        ];

        let boardState = [...initialBoard];
        let selectedIndex = -1;
        const boardElement = document.getElementById('board');

        function renderBoard() {
            boardElement.innerHTML = '';
            boardState.forEach((value, index) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (initialBoard[index] !== 0) {
                    cell.classList.add('fixed');
                    cell.textContent = value;
                } else {
                    cell.textContent = value === 0 ? '' : value;
                    cell.onclick = () => selectCell(index);
                    if (index === selectedIndex) {
                        cell.classList.add('selected');
                    }
                }
                boardElement.appendChild(cell);
            });
        }

        function selectCell(index) {
            selectedIndex = index;
            renderBoard();
        }

        function inputNumber(num) {
            if (selectedIndex === -1) return;
            if (num === 'C') {
                boardState[selectedIndex] = 0;
            } else {
                boardState[selectedIndex] = num;
            }
            selectedIndex = -1;
            renderBoard();
        }

        // Ініціалізація
        renderBoard();
    </script>
</body>
</html>
