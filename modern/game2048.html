<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #score { font-size: 22px; margin: 20px 0; }
        #board { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; max-width: 320px; margin: 20px auto; }
        .tile { width: 70px; height: 70px; background: #ddd; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
        .tile-2 { background: #eee; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #fff; }
        .tile-16 { background: #f59563; color: #fff; }
        .tile-32 { background: #f67c5f; color: #fff; }
        .tile-64 { background: #f65e3b; color: #fff; }
        .tile-128 { background: #edcf72; color: #fff; font-size: 24px; }
        .tile-256 { background: #edcc61; color: #fff; font-size: 24px; }
        .tile-512 { background: #edc850; color: #fff; font-size: 24px; }
        .tile-1024 { background: #edc53f; color: #fff; font-size: 20px; }
        .tile-2048 { background: #edc22e; color: #fff; font-size: 20px; }
        #controls { margin: 20px 0; }
        .control-btn { padding: 15px 25px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 5px; }
        .control-btn:active { background: #000; color: #fff; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>2048</h1>
    <p>З'єднуйте однакові числа, щоб отримати 2048!</p>
    
    <div id="score">Рахунок: 0</div>
    <div id="board"></div>
    
    <div id="controls">
        <button class="control-btn" onclick="move('up')">↑</button><br>
        <button class="control-btn" onclick="move('left')">←</button>
        <button class="control-btn" onclick="move('down')">↓</button>
        <button class="control-btn" onclick="move('right')">→</button>
    </div>
    
    <button id="new-game" onclick="initGame()">Нова гра</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        let grid, score;

        function initGame() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            addRandomTile();
            addRandomTile();
            updateDisplay();
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) empty.push({r, c});
                }
            }
            if (empty.length > 0) {
                const {r, c} = empty[Math.floor(Math.random() * empty.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateDisplay() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            document.getElementById('score').textContent = 'Рахунок: ' + score;
            
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    if (grid[r][c] > 0) {
                        tile.textContent = grid[r][c];
                        tile.classList.add('tile-' + grid[r][c]);
                    }
                    boardEl.appendChild(tile);
                }
            }
        }

        function move(direction) {
            let moved = false;
            const newGrid = grid.map(row => [...row]);
            
            if (direction === 'left') {
                for (let r = 0; r < 4; r++) {
                    const row = grid[r].filter(x => x !== 0);
                    for (let i = 0; i < row.length - 1; i++) {
                        if (row[i] === row[i + 1]) {
                            row[i] *= 2;
                            score += row[i];
                            row.splice(i + 1, 1);
                        }
                    }
                    while (row.length < 4) row.push(0);
                    if (row.join(',') !== grid[r].join(',')) moved = true;
                    newGrid[r] = row;
                }
            } else if (direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    const row = grid[r].filter(x => x !== 0).reverse();
                    for (let i = 0; i < row.length - 1; i++) {
                        if (row[i] === row[i + 1]) {
                            row[i] *= 2;
                            score += row[i];
                            row.splice(i + 1, 1);
                        }
                    }
                    while (row.length < 4) row.push(0);
                    row.reverse();
                    if (row.join(',') !== grid[r].join(',')) moved = true;
                    newGrid[r] = row;
                }
            } else if (direction === 'up') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]].filter(x => x !== 0);
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            score += col[i];
                            col.splice(i + 1, 1);
                        }
                    }
                    while (col.length < 4) col.push(0);
                    const oldCol = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                    if (col.join(',') !== oldCol.join(',')) moved = true;
                    for (let r = 0; r < 4; r++) newGrid[r][c] = col[r];
                }
            } else if (direction === 'down') {
                for (let c = 0; c < 4; c++) {
                    const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]].filter(x => x !== 0).reverse();
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            score += col[i];
                            col.splice(i + 1, 1);
                        }
                    }
                    while (col.length < 4) col.push(0);
                    col.reverse();
                    const oldCol = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                    if (col.join(',') !== oldCol.join(',')) moved = true;
                    for (let r = 0; r < 4; r++) newGrid[r][c] = col[r];
                }
            }
            
            if (moved) {
                grid = newGrid;
                addRandomTile();
                updateDisplay();
                checkGameOver();
            }
        }

        function checkGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
                }
            }
            document.getElementById('score').textContent = 'Гра закінчена! Рахунок: ' + score;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') move('up');
            else if (e.key === 'ArrowDown') move('down');
            else if (e.key === 'ArrowLeft') move('left');
            else if (e.key === 'ArrowRight') move('right');
        });

        initGame();
    </script>
</body>
</html>
