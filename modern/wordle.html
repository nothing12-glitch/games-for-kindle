<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вгадай слово</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #guesses { display: flex; flex-direction: column; gap: 5px; margin: 20px auto; max-width: 300px; }
        .row { display: flex; gap: 5px; justify-content: center; }
        .letter { width: 50px; height: 50px; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; text-transform: uppercase; }
        .letter.correct { background: #90EE90; }
        .letter.present { background: #FFD700; }
        .letter.absent { background: #ddd; }
        #message { font-size: 20px; margin: 20px 0; min-height: 30px; }
        .keyboard { display: grid; gap: 5px; max-width: 400px; margin: 20px auto; }
        .keyboard-row { display: flex; gap: 5px; justify-content: center; }
        .key { padding: 12px 8px; font-size: 18px; font-weight: bold; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; min-width: 35px; }
        .key:active { background: #000; color: #fff; }
        .key.correct { background: #90EE90; }
        .key.present { background: #FFD700; }
        .key.absent { background: #ddd; color: #999; }
        .key.enter { background: #4CAF50; color: #fff; min-width: 60px; }
        .key.delete { background: #f44336; color: #fff; min-width: 60px; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 id="t">Вгадай слово</h1>
    <p id="d">Вгадайте слово з 5 літер за 6 спроб</p>
    
    <div id="guesses"></div>
    <div id="message"></div>
    
    <div class="keyboard" id="keyboard"></div>
    
    <button id="new-game" onclick="initGame()">Нова гра</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        const L={
            en:{t:"Word Guess",d:"Guess the 5-letter word in 6 tries",need:"Enter 5 letters!",win:"You won!",lose:"You lost! The word was: ",enter:"ENTER",best:"Best",bn:"New Game",bb:"Menu"},
            uk:{t:"Вгадай слово",d:"Вгадайте слово з 5 літер за 6 спроб",need:"Введіть 5 літер!",win:"Ви виграли!",lose:"Ви програли! Слово було: ",enter:"ВВІД",best:"Рекорд",bn:"Нова гра",bb:"До меню"},
            de:{t:"Wort-Raten",d:"Errate das 5-Buchstaben-Wort in 6 Versuchen",need:"Gib 5 Buchstaben ein!",win:"Gewonnen!",lose:"Verloren! Das Wort war: ",enter:"EINGABE",best:"Rekord",bn:"Neues Spiel",bb:"Menü"},
            pl:{t:"Zgadnij słowo",d:"Zgadnij 5-literowe słowo w 6 próbach",need:"Wpisz 5 liter!",win:"Wygrałeś!",lose:"Przegrałeś! Słowo brzmiało: ",enter:"ENTER",best:"Rekord",bn:"Nowa gra",bb:"Menu"}
        };
        let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
        document.documentElement.lang=lang;
        document.getElementById('t').textContent=L[lang].t;
        document.getElementById('d').textContent=L[lang].d;
        document.getElementById('new-game').textContent=L[lang].bn;
        document.getElementById('back-btn').textContent=L[lang].bb;

        function bump(key) {
            localStorage.setItem(key, '' + (+(localStorage.getItem(key) || 0) + 1));
        }

        function saveBestLow(key, val) {
            const prev = +(localStorage.getItem(key) || 0);
            if (!prev || val < prev) localStorage.setItem(key, '' + val);
        }

        const words = {
            uk: ['КНИГА', 'ЕКРАН', 'СЛОВО', 'ТЕКСТ', 'АВТОР', 'ГЛАВА', 'СЦЕНА', 'ФІЛЬМ', 'ПІСНЯ', 'ВІТЕР', 'ЗЕМЛЯ', 'СОНЦЕ', 'ЗІРКА', 'РІЧКА', 'ХМАРА', 'ЛІТАК', 'ПОЇЗД', 'МІСТО', 'КВІТИ', 'ДЗВІН'],
            en: ['HOUSE', 'WATER', 'EARTH', 'MUSIC', 'LIGHT', 'DREAM', 'HEART', 'SMILE', 'DANCE', 'OCEAN', 'RIVER', 'FIELD', 'CLOUD', 'STORM', 'BEACH', 'TRAIN', 'CHAIR', 'TABLE', 'BREAD', 'STONE'],
            de: ['WOLKE', 'FLUSS', 'TRAUM', 'LICHT', 'MUSIK', 'OZEAN', 'STERN', 'SONNE', 'REGEN', 'BLUME', 'TISCH', 'STUHL', 'KRAFT', 'PFERD', 'VOGEL', 'APFEL', 'BIRNE', 'ZIEGE', 'KATZE', 'WIESE'],
            pl: ['EKRAN', 'SŁOWO', 'TEKST', 'AUTOR', 'WIATR', 'SERCE', 'OCEAN', 'RZEKA', 'ŁÓDKA', 'KROWA', 'DRZWI', 'LAMPA', 'KOLOR', 'DZIEŃ', 'ZEGAR', 'MORZE', 'PLAŻA', 'BURZA', 'TĘCZA', 'TRAWA']
        };
        
        const keyboardLayout = {
            uk: [
                ['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х','Ї'],
                ['Ф','І','В','А','П','Р','О','Л','Д','Ж','Є'],
                ['Я','Ч','С','М','И','Т','Ь','Б','Ю','⌫','ENTER']
            ],
            en: [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L'],
                ['⌫','Z','X','C','V','B','N','M','ENTER']
            ],
            de: [
                ['Q','W','E','R','T','Z','U','I','O','P','Ü'],
                ['A','S','D','F','G','H','J','K','L','Ö','Ä'],
                ['⌫','Y','X','C','V','B','N','M','ENTER']
            ],
            pl: [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L','Ł'],
                ['Z','X','C','V','B','N','M','Ę','Ó'],
                ['⌫','Ś','Ą','Ć','Ń','Ż','Ź','ENTER']
            ]
        };

        let target, guesses, gameOver, currentGuess, currentLang;

        function initGame() {
            currentLang = lang;
            const wordList = words[currentLang] || words.en;
            target = wordList[Math.floor(Math.random() * wordList.length)];
            guesses = [];
            gameOver = false;
            currentGuess = '';
            document.getElementById('message').textContent = '';
            renderGuesses();
            createKeyboard();
            saveGame();
        }

        function renderGuesses() {
            const guessesEl = document.getElementById('guesses');
            guessesEl.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                
                for (let j = 0; j < 5; j++) {
                    const letter = document.createElement('div');
                    letter.className = 'letter';
                    
                    if (guesses[i]) {
                        letter.textContent = guesses[i].word[j];
                        if (guesses[i].result[j] === 'correct') letter.classList.add('correct');
                        else if (guesses[i].result[j] === 'present') letter.classList.add('present');
                        else if (guesses[i].result[j] === 'absent') letter.classList.add('absent');
                    }
                    
                    row.appendChild(letter);
                }
                
                guessesEl.appendChild(row);
            }
        }

        function createKeyboard() {
            const keyboardEl = document.getElementById('keyboard');
            keyboardEl.innerHTML = '';
            const layout = keyboardLayout[currentLang] || keyboardLayout.en;
            
            layout.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'keyboard-row';
                
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    btn.textContent = key;
                    
                    if (key === 'ENTER') {
                        btn.textContent = L[lang].enter;
                        btn.classList.add('enter');
                        btn.dataset.role = 'enter';
                        btn.onclick = submitGuess;
                    } else if (key === '⌫') {
                        btn.classList.add('delete');
                        btn.dataset.role = 'delete';
                        btn.onclick = deleteLetter;
                    } else {
                        btn.onclick = () => addLetter(key);
                    }
                    
                    rowEl.appendChild(btn);
                });
                
                keyboardEl.appendChild(rowEl);
            });
        }

        function addLetter(letter) {
            if (gameOver || currentGuess.length >= 5) return;
            currentGuess += letter;
            updateCurrentRow();
        }

        function deleteLetter() {
            if (gameOver || currentGuess.length === 0) return;
            currentGuess = currentGuess.slice(0, -1);
            updateCurrentRow();
        }

        function updateCurrentRow() {
            const rows = document.querySelectorAll('.row');
            const currentRow = rows[guesses.length];
            if (!currentRow) return;
            
            const cells = currentRow.querySelectorAll('.letter');
            for (let i = 0; i < 5; i++) {
                cells[i].textContent = currentGuess[i] || '';
            }
        }

        function submitGuess() {
            if (gameOver || currentGuess.length !== 5) {
                document.getElementById('message').textContent = L[lang].need;
                return;
            }
            
            const result = Array(5).fill('absent');
            const targetLetters = target.split('');
            const guessLetters = currentGuess.split('');
            
            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    result[i] = 'correct';
                    targetLetters[i] = null;
                    guessLetters[i] = null;
                }
            }
            
            for (let i = 0; i < 5; i++) {
                if (guessLetters[i] && targetLetters.includes(guessLetters[i])) {
                    result[i] = 'present';
                    targetLetters[targetLetters.indexOf(guessLetters[i])] = null;
                }
            }
            
            guesses.push({ word: currentGuess, result });
            currentGuess = '';
            renderGuesses();
            updateKeyboard();
            saveGame();
            
            if (guesses[guesses.length - 1].word === target) {
                bump('stats_wordle_wins');
                bump('stats_wordle_games');
                saveBestLow('best_wordle', guesses.length);
                document.getElementById('message').textContent = L[lang].win + ' | ' + L[lang].best + ': ' + localStorage.getItem('best_wordle');
                gameOver = true;
                localStorage.removeItem('wordle_save');
            } else if (guesses.length === 6) {
                bump('stats_wordle_games');
                document.getElementById('message').textContent = L[lang].lose + target;
                gameOver = true;
                localStorage.removeItem('wordle_save');
            }
        }

        function updateKeyboard() {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                if (key.dataset && key.dataset.role) return;
                const letter = key.textContent;
                
                let status = '';
                guesses.forEach(g => {
                    for (let i = 0; i < 5; i++) {
                        if (g.word[i] === letter) {
                            if (g.result[i] === 'correct') status = 'correct';
                            else if (g.result[i] === 'present' && status !== 'correct') status = 'present';
                            else if (!status) status = 'absent';
                        }
                    }
                });
                
                key.className = 'key ' + status;
            });
        }

        function saveGame() {
            try {
                localStorage.setItem('wordle_save', JSON.stringify({
                    target, guesses, gameOver, currentGuess, currentLang
                }));
            } catch(e) {}
        }

        function loadGame() {
            try {
                const saved = localStorage.getItem('wordle_save');
                if (saved) {
                    const data = JSON.parse(saved);
                    target = data.target;
                    guesses = data.guesses;
                    gameOver = data.gameOver;
                    currentGuess = data.currentGuess || '';
                    currentLang = data.currentLang || lang;
                    renderGuesses();
                    createKeyboard();
                    updateCurrentRow();
                    updateKeyboard();
                    if (gameOver) {
                        if (guesses[guesses.length - 1].word === target) {
                            document.getElementById('message').textContent = L[lang].win;
                        } else {
                            document.getElementById('message').textContent = L[lang].lose + target;
                        }
                    }
                    return true;
                }
            } catch(e) {}
            return false;
        }

        if (!loadGame()) {
            initGame();
        }
    </script>
</body>
</html>
