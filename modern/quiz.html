<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вікторина</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #question { font-size: 24px; margin: 30px 0; font-weight: bold; }
        #answers { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .answer-btn { padding: 20px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; text-align: left; }
        .answer-btn:active { background: #000; color: #fff; }
        .answer-btn.correct { background: #90EE90; }
        .answer-btn.wrong { background: #ffcccc; }
        #score { font-size: 22px; margin: 20px 0; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 id="t">Вікторина</h1>
    
    <div id="score">Питання: 1/10 | Правильних: 0</div>
    <div id="question"></div>
    <div id="answers"></div>
    
    <button id="new-game" onclick="initGame()">Нова гра</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        const L={
            en:{t:"Quiz",q:"Question",correct:"Correct",done:"Quiz finished!",result:"Result",best:"Best",bn:"New Game",bb:"Menu",
                questions:[
                    {q:'What is the capital of Ukraine?',a:['Kyiv','Lviv','Odesa','Kharkiv'],correct:0},
                    {q:'How many planets are in the Solar System?',a:['7','8','9','10'],correct:1},
                    {q:'Who wrote "Hamlet"?',a:['Shakespeare','Goethe','Dante','Cervantes'],correct:0},
                    {q:'In which year was Kyiv founded?',a:['482','988','1240','1648'],correct:0},
                    {q:'The longest river in Ukraine?',a:['Dnieper','Dniester','Desna','Southern Bug'],correct:0},
                    {q:'How many colors are in a rainbow?',a:['5','6','7','8'],correct:2},
                    {q:'Which language has the most native speakers?',a:['English','Chinese','Spanish','Hindi'],correct:1},
                    {q:'Who was the first human in space?',a:['Armstrong','Gagarin','Korolev','Titov'],correct:1},
                    {q:'How many days are in a leap year?',a:['364','365','366','367'],correct:2},
                    {q:'Which ocean is the largest?',a:['Atlantic','Indian','Pacific','Arctic'],correct:2}
                ]},
            uk:{t:"Вікторина",q:"Питання",correct:"Правильних",done:"Вікторина завершена!",result:"Результат",best:"Рекорд",bn:"Нова гра",bb:"До меню",
                questions:[
                    {q:'Яка столиця України?',a:['Київ','Львів','Одеса','Харків'],correct:0},
                    {q:'Скільки планет у Сонячній системі?',a:['7','8','9','10'],correct:1},
                    {q:'Хто написав "Гамлета"?',a:['Шекспір','Гете','Данте','Сервантес'],correct:0},
                    {q:'Який рік заснування Києва?',a:['482','988','1240','1648'],correct:0},
                    {q:'Найдовша річка України?',a:['Дніпро','Дністер','Десна','Південний Буг'],correct:0},
                    {q:'Скільки кольорів у веселці?',a:['5','6','7','8'],correct:2},
                    {q:'Яка мова найпоширеніша у світі?',a:['Англійська','Китайська','Іспанська','Хінді'],correct:1},
                    {q:'Хто перший полетів у космос?',a:['Армстронг','Гагарін','Корольов','Титов'],correct:1},
                    {q:'Скільки днів у високосному році?',a:['364','365','366','367'],correct:2},
                    {q:'Який океан найбільший?',a:['Атлантичний','Індійський','Тихий','Північний Льодовитий'],correct:2}
                ]},
            de:{t:"Quiz",q:"Frage",correct:"Richtig",done:"Quiz beendet!",result:"Ergebnis",best:"Rekord",bn:"Neues Spiel",bb:"Menü",
                questions:[
                    {q:'Was ist die Hauptstadt der Ukraine?',a:['Kiew','Lwiw','Odessa','Charkiw'],correct:0},
                    {q:'Wie viele Planeten hat das Sonnensystem?',a:['7','8','9','10'],correct:1},
                    {q:'Wer schrieb "Hamlet"?',a:['Shakespeare','Goethe','Dante','Cervantes'],correct:0},
                    {q:'In welchem Jahr wurde Kiew gegründet?',a:['482','988','1240','1648'],correct:0},
                    {q:'Der längste Fluss der Ukraine?',a:['Dnjepr','Dnister','Desna','Südlicher Bug'],correct:0},
                    {q:'Wie viele Farben hat ein Regenbogen?',a:['5','6','7','8'],correct:2},
                    {q:'Welche Sprache hat die meisten Muttersprachler?',a:['Englisch','Chinesisch','Spanisch','Hindi'],correct:1},
                    {q:'Wer war der erste Mensch im Weltraum?',a:['Armstrong','Gagarin','Koroljow','Titow'],correct:1},
                    {q:'Wie viele Tage hat ein Schaltjahr?',a:['364','365','366','367'],correct:2},
                    {q:'Welcher Ozean ist der größte?',a:['Atlantik','Indik','Pazifik','Arktischer Ozean'],correct:2}
                ]},
            pl:{t:"Quiz",q:"Pytanie",correct:"Poprawne",done:"Quiz zakończony!",result:"Wynik",best:"Rekord",bn:"Nowa gra",bb:"Menu",
                questions:[
                    {q:'Jaka jest stolica Ukrainy?',a:['Kijów','Lwów','Odessa','Charków'],correct:0},
                    {q:'Ile planet jest w Układzie Słonecznym?',a:['7','8','9','10'],correct:1},
                    {q:'Kto napisał "Hamleta"?',a:['Szekspir','Goethe','Dante','Cervantes'],correct:0},
                    {q:'W którym roku założono Kijów?',a:['482','988','1240','1648'],correct:0},
                    {q:'Najdłuższa rzeka Ukrainy?',a:['Dniepr','Dniestr','Desna','Południowy Bug'],correct:0},
                    {q:'Ile kolorów ma tęcza?',a:['5','6','7','8'],correct:2},
                    {q:'Który język ma najwięcej native speakerów?',a:['Angielski','Chiński','Hiszpański','Hindi'],correct:1},
                    {q:'Kto był pierwszym człowiekiem w kosmosie?',a:['Armstrong','Gagarin','Korolow','Titow'],correct:1},
                    {q:'Ile dni ma rok przestępny?',a:['364','365','366','367'],correct:2},
                    {q:'Który ocean jest największy?',a:['Atlantycki','Indyjski','Spokojny','Arktyczny'],correct:2}
                ]}
        };
        let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
        document.documentElement.lang=lang;
        document.getElementById('t').textContent=L[lang].t;
        document.getElementById('new-game').textContent=L[lang].bn;
        document.getElementById('back-btn').textContent=L[lang].bb;

        const questions = L[lang].questions;
        
        let currentQ, score, answered, gameToken = 0, advanceTimer = null;

        function initGame() {
            gameToken++;
            if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
            currentQ = 0;
            score = 0;
            answered = false;
            showQuestion();
        }

        function showQuestion() {
            if (currentQ >= questions.length) {
                if (score > +(localStorage.getItem('best_quiz') || 0)) localStorage.setItem('best_quiz', '' + score);
                document.getElementById('question').textContent = L[lang].done;
                document.getElementById('answers').innerHTML = '';
                document.getElementById('score').textContent = L[lang].result + ': ' + score + '/' + questions.length + ' | ' + L[lang].best + ': ' + localStorage.getItem('best_quiz') + '/' + questions.length;
                return;
            }
            
            answered = false;
            const q = questions[currentQ];
            document.getElementById('question').textContent = q.q;
            document.getElementById('score').textContent = L[lang].q + ': ' + (currentQ + 1) + '/' + questions.length + ' | ' + L[lang].correct + ': ' + score;
            
            const answersEl = document.getElementById('answers');
            answersEl.innerHTML = '';
            
            q.a.forEach((answer, i) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => selectAnswer(i, btn);
                answersEl.appendChild(btn);
            });
        }

        function selectAnswer(index, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentQ];
            const buttons = document.querySelectorAll('.answer-btn');
            
            if (index === q.correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                buttons[q.correct].classList.add('correct');
            }
            
            const token = gameToken;
            advanceTimer = setTimeout(() => {
                advanceTimer = null;
                if (token !== gameToken) return;
                currentQ++;
                showQuestion();
            }, 1500);
        }

        initGame();
    </script>
</body>
</html>
