<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меморі</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff; }
        h1 { font-size: 28px; }
        #board { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; max-width: 320px; margin: 20px auto; }
        .card { width: 70px; height: 70px; background: #000; border: 3px solid #000; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; color: #fff; }
        .card.flipped { background: #fff; color: #000; }
        .card.matched { background: #90EE90; color: #000; }
        #info { font-size: 20px; margin: 20px 0; }
        #new-game { padding: 15px 30px; font-size: 20px; background: #fff; border: 2px solid #000; border-radius: 5px; cursor: pointer; margin: 10px; }
        #back-btn { display: inline-block; padding: 15px 30px; background: #ddd; border: 2px solid #000; text-decoration: none; color: #000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 id="t">Меморі</h1>
    <p id="d">Знайдіть всі пари однакових карток</p>
    
    <div id="info">Ходів: 0 | Знайдено пар: 0/8</div>
    <div id="board"></div>
    
    <button id="new-game" onclick="initGame()">Нова гра</button>
    <br>
    <a href="index.html" id="back-btn">До меню</a>

    <script>
        const L={
            en:{t:"Memory",d:"Find all matching pairs",moves:"Moves",pairs:"Pairs found",win:"You won in {n} moves!",bn:"New Game",bb:"Menu"},
            uk:{t:"Меморі",d:"Знайдіть всі пари однакових карток",moves:"Ходів",pairs:"Знайдено пар",win:"Ви виграли за {n} ходів!",bn:"Нова гра",bb:"До меню"},
            de:{t:"Memory",d:"Finde alle Paare",moves:"Züge",pairs:"Gefundene Paare",win:"Gewonnen in {n} Zügen!",bn:"Neues Spiel",bb:"Menü"},
            pl:{t:"Memory",d:"Znajdź wszystkie pary",moves:"Ruchy",pairs:"Znalezione pary",win:"Wygrałeś w {n} ruchach!",bn:"Nowa gra",bb:"Menu"}
        };
        let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
        document.documentElement.lang=lang;
        document.getElementById('t').textContent=L[lang].t;
        document.getElementById('d').textContent=L[lang].d;
        document.getElementById('new-game').textContent=L[lang].bn;
        document.getElementById('back-btn').textContent=L[lang].bb;

        const symbols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        let cards, flipped, matched, moves, canFlip;

        function initGame() {
            const pairs = [...symbols, ...symbols];
            cards = pairs.sort(() => Math.random() - 0.5);
            flipped = [];
            matched = Array(16).fill(false);
            moves = 0;
            canFlip = true;
            updateInfo();
            renderBoard();
        }

        function updateInfo() {
            const found = matched.filter(m => m).length / 2;
            document.getElementById('info').textContent = L[lang].moves + ': ' + moves + ' | ' + L[lang].pairs + ': ' + found + '/8';
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                if (flipped.includes(i) || matched[i]) {
                    card.textContent = cards[i];
                    card.classList.add('flipped');
                    if (matched[i]) card.classList.add('matched');
                }
                card.onclick = () => flipCard(i);
                boardEl.appendChild(card);
            }
        }

        function flipCard(index) {
            if (!canFlip || flipped.includes(index) || matched[index]) return;
            
            flipped.push(index);
            renderBoard();
            
            if (flipped.length === 2) {
                moves++;
                canFlip = false;
                const [i, j] = flipped;
                
                if (cards[i] === cards[j]) {
                    matched[i] = true;
                    matched[j] = true;
                    flipped = [];
                    canFlip = true;
                    updateInfo();
                    renderBoard();
                    
                    if (matched.every(m => m)) {
                        document.getElementById('info').textContent = L[lang].win.replace('{n}', moves);
                    }
                } else {
                    setTimeout(() => {
                        flipped = [];
                        canFlip = true;
                        renderBoard();
                    }, 1000);
                }
            }
        }

        initGame();
    </script>
</body>
</html>
