<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battleship</title>
<style>
body{font-family:Georgia,serif;text-align:center;padding:15px 10px 30px;background:#fff;color:#000}
h1{font-size:26px;margin:5px 0 10px}
.hint{font-size:15px;color:#555;margin:0 auto 10px;max-width:420px;line-height:1.4}
#info{font-size:18px;font-weight:bold;margin:10px auto;min-height:24px;max-width:440px}
.legend{font-size:14px;color:#555;margin-bottom:10px}
.label{font-size:16px;font-weight:bold;margin:14px 0 6px}
.board{display:grid;grid-template-columns:repeat(10,32px);gap:2px;justify-content:center;margin:0 auto}
.cell{width:32px;height:32px;border:1px solid #000;background:#fff;color:#000;font-size:17px;line-height:30px;text-align:center;box-sizing:border-box;font-family:Georgia,serif;-webkit-tap-highlight-color:transparent}
.board.enemy .cell{cursor:pointer}
.board.enemy .cell:active{background:#ddd}
.cell.miss{color:#777}
.cell.mark{background:#000;color:#fff;font-weight:bold}
.cell.ship{background:#000}
.controls{margin-top:22px}
button.btn,a.btn{display:inline-block;padding:12px 25px;font-size:18px;border:2px solid #000;background:#fff;color:#000;border-radius:6px;cursor:pointer;text-decoration:none;font-weight:bold;margin:5px;font-family:Georgia,serif}
button.btn:active,a.btn:active{background:#ddd}
@media (min-width:520px){
.board{grid-template-columns:repeat(10,38px);gap:3px}
.cell{width:38px;height:38px;line-height:36px;font-size:20px}
}
</style>
</head>
<body>
<h1 id="t"></h1>
<p class="hint" id="d"></p>
<div id="info"></div>
<div class="legend" id="lg"></div>
<div class="label" id="lb1"></div>
<div class="board" id="myBoard"></div>
<div class="label" id="lb2"></div>
<div class="board enemy" id="enemyBoard"></div>
<div class="controls"><button class="btn" id="bn"></button> <a class="btn" href="index.html" id="bb"></a></div>
<script>
var L={
en:{t:"Battleship",d:"Tap enemy waters to shoot. A hit lets you shoot again. A miss passes the turn to the computer.",lg:"× miss · ● hit · ■ sunk",yourWaters:"Your fleet",enemyWaters:"Enemy waters",yourTurn:"Your turn — tap enemy waters",enemyTurn:"Enemy is aiming...",hit:"Hit! Shoot again.",miss:"Miss. Enemy's turn.",sunk:"Ship destroyed! Shoot again.",lostShip:"The enemy sank your ship!",win:"Victory! Enemy fleet is sunk.",lose:"Defeat. Your fleet is sunk.",bn:"New Game",bb:"Menu",wins:"Wins",ships:"ships"},
uk:{t:"Морський бій",d:"Торкнись клітинки ворожих вод, щоб вистрілити. Влучання — стріляй ще. Промах — хід комп'ютера.",lg:"× промах · ● влучання · ■ знищено",yourWaters:"Твій флот",enemyWaters:"Ворожі води",yourTurn:"Твій хід — торкнись ворожих вод",enemyTurn:"Ворог цілиться...",hit:"Влучання! Стріляй ще.",miss:"Промах. Хід ворога.",sunk:"Корабель знищено! Стріляй ще.",lostShip:"Ворог знищив твій корабель!",win:"Перемога! Ворожий флот потоплено.",lose:"Поразка. Твій флот потоплено.",bn:"Нова гра",bb:"Меню",wins:"Перемог",ships:"кораблів"},
de:{t:"Schiffe versenken",d:"Tippe auf feindliches Wasser, um zu schießen. Ein Treffer bringt einen zweiten Schuss. Daneben heißt: der Computer ist dran.",lg:"× daneben · ● Treffer · ■ versenkt",yourWaters:"Deine Flotte",enemyWaters:"Feindliche Gewässer",yourTurn:"Du bist dran — tippe aufs Wasser",enemyTurn:"Der Gegner zielt...",hit:"Treffer! Nochmal schießen.",miss:"Daneben. Der Gegner ist dran.",sunk:"Schiff versenkt! Nochmal schießen.",lostShip:"Der Gegner hat dein Schiff versenkt!",win:"Sieg! Die feindliche Flotte ist versenkt.",lose:"Niederlage. Deine Flotte ist versenkt.",bn:"Neues Spiel",bb:"Menü",wins:"Siege",ships:"Schiffe"},
pl:{t:"Statki",d:"Dotknij wrogich wód, aby strzelić. Trafienie daje kolejny strzał. Pudło — ruch komputera.",lg:"× pudło · ● trafienie · ■ zatopiony",yourWaters:"Twoja flota",enemyWaters:"Wrogie wody",yourTurn:"Twój ruch — dotknij wrogich wód",enemyTurn:"Wróg celuje...",hit:"Trafienie! Strzelaj dalej.",miss:"Pudło. Ruch wroga.",sunk:"Statek zatopiony! Strzelaj dalej.",lostShip:"Wróg zatopił twój statek!",win:"Zwycięstwo! Wroga flota zatopiona.",lose:"Porażka. Twoja flota zatopiona.",bn:"Nowa gra",bb:"Menu",wins:"Zwycięstwa",ships:"statków"}};
var lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';

var SIZE=10;
var FLEET=[4,3,3,2,2,2,1,1,1,1];
var myShips=[],enShips=[];
var myGrid=[],enGrid=[];
var turn='p',over=false,aiQueue=[],gameId=0;
var myCells=[],enCells=[];

function rnd(n){return Math.floor(Math.random()*n);}

function canPlace(grid,r,c,size,horiz){
var cells=[],i,dr,dc,rr,cc;
for(i=0;i<size;i++){
rr=r+(horiz?0:i);cc=c+(horiz?i:0);
if(rr<0||cc<0||rr>=SIZE||cc>=SIZE)return null;
cells.push([rr,cc]);
}
for(i=0;i<cells.length;i++){
for(dr=-1;dr<=1;dr++)for(dc=-1;dc<=1;dc++){
rr=cells[i][0]+dr;cc=cells[i][1]+dc;
if(rr>=0&&cc>=0&&rr<SIZE&&cc<SIZE&&grid[rr*SIZE+cc]===1)return null;
}
}
return cells;
}

function placeFleet(){
var ships=[],grid=[],i,s,size,placed,tries,horiz,r,c,cells,k;
for(i=0;i<SIZE*SIZE;i++)grid.push(0);
for(s=0;s<FLEET.length;s++){
size=FLEET[s];placed=false;tries=0;
while(!placed&&tries<2000){
tries++;
horiz=Math.random()<0.5;
r=rnd(SIZE);c=rnd(SIZE);
cells=canPlace(grid,r,c,size,horiz);
if(cells){
for(k=0;k<cells.length;k++)grid[cells[k][0]*SIZE+cells[k][1]]=1;
ships.push({cells:cells,hits:0,size:size});
placed=true;
}
}
if(!placed)return placeFleet();
}
return {ships:ships,grid:grid};
}

function shipAt(ships,r,c){
for(var i=0;i<ships.length;i++)for(var k=0;k<ships[i].cells.length;k++){
if(ships[i].cells[k][0]===r&&ships[i].cells[k][1]===c)return ships[i];
}
return null;
}

function allSunk(ships){
for(var i=0;i<ships.length;i++)if(ships[i].hits<ships[i].size)return false;
return true;
}

function markSunk(grid,ship,val){
for(var k=0;k<ship.cells.length;k++)grid[ship.cells[k][0]*SIZE+ship.cells[k][1]]=val;
}

function info(s){document.getElementById('info').textContent=s;}

function buildBoard(el){
var refs=[],i,d;
el.innerHTML='';
for(i=0;i<SIZE*SIZE;i++){
d=document.createElement('div');
d.className='cell unknown';
el.appendChild(d);
refs.push(d);
}
return refs;
}

function paint(my){
var grid=my?myGrid:enGrid,refs=my?myCells:enCells,i,v,cls,txt;
for(i=0;i<grid.length;i++){
v=grid[i];cls='cell';txt='';
if(v===1){cls+=' ship';}
else if(v===2){cls+=' miss';txt='×';}
else if(v===3){cls+=' mark';txt='●';}
else if(v===4){cls+=' mark';txt='■';}
else if(v===5){cls+=' ship';}
else if(v===0){cls+=' unknown';}
refs[i].className=cls;
refs[i].textContent=txt;
}
}

function render(){
paint(true);
paint(false);
}

function updateLabels(){
var mine=0,his=0,i;
for(i=0;i<myShips.length;i++)if(myShips[i].hits<myShips[i].size)mine++;
for(i=0;i<enShips.length;i++)if(enShips[i].hits<enShips[i].size)his++;
document.getElementById('lb1').textContent=L[lang].yourWaters+' — '+mine+' '+L[lang].ships;
document.getElementById('lb2').textContent=L[lang].enemyWaters+' — '+his+' '+L[lang].ships;
}

function enemyUnknown(r,c){return enGrid[r*SIZE+c]===0;}

function freeCell(r,c){
var v=myGrid[r*SIZE+c];
return v===0||v===1;
}

function addNeighbours(r,c){
var d=[[1,0],[-1,0],[0,1],[0,-1]];
for(var i=0;i<d.length;i++){
var rr=r+d[i][0],cc=c+d[i][1];
if(rr>=0&&cc>=0&&rr<SIZE&&cc<SIZE&&freeCell(rr,cc))aiQueue.push([rr,cc]);
}
}

function aiPick(){
var t=[],r,c,cells=[];
while(aiQueue.length){
t=aiQueue.pop();
if(freeCell(t[0],t[1]))return t;
}
for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++){
if(freeCell(r,c)&&(r+c)%2===0)cells.push([r,c]);
}
if(!cells.length)for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++){
if(freeCell(r,c))cells.push([r,c]);
}
if(!cells.length)return null;
return cells[rnd(cells.length)];
}

function finish(win){
over=true;turn='over';
if(win){
var wins=+(localStorage.getItem('stats_bs_wins')||0)+1;
localStorage.setItem('stats_bs_wins',''+wins);
}
var games=+(localStorage.getItem('stats_bs_games')||0)+1;
localStorage.setItem('stats_bs_games',''+games);
for(var i=0;i<enShips.length;i++)for(var k=0;k<enShips[i].cells.length;k++){
var idx=enShips[i].cells[k][0]*SIZE+enShips[i].cells[k][1];
if(enGrid[idx]===0)enGrid[idx]=5;
}
render();updateLabels();
info(win?L[lang].win:L[lang].lose);
}

function playerShoot(r,c){
if(over||turn!=='p')return;
if(!enemyUnknown(r,c))return;
var id=gameId,ship=shipAt(enShips,r,c),i=r*SIZE+c,again=!!ship;
if(ship){enGrid[i]=3;ship.hits++;
if(ship.hits===ship.size){ship.sunk=true;markSunk(enGrid,ship,4);info(L[lang].sunk);}
else info(L[lang].hit);
}else{enGrid[i]=2;info(L[lang].miss);}
render();updateLabels();
if(allSunk(enShips)){finish(true);return;}
if(!again){turn='c';info(L[lang].enemyTurn);setTimeout(function(){if(id===gameId)aiTurn();},900);}
}

function aiTurn(){
if(over||turn!=='c')return;
var id=gameId,t=aiPick();
if(!t){return;}
var r=t[0],c=t[1],i=r*SIZE+c,ship=shipAt(myShips,r,c),again=!!ship;
if(ship){myGrid[i]=3;ship.hits++;
if(ship.hits===ship.size){ship.sunk=true;markSunk(myGrid,ship,4);aiQueue=[];info(L[lang].lostShip);}
else {addNeighbours(r,c);info(L[lang].enemyTurn);}
}else{myGrid[i]=2;info(L[lang].enemyTurn);}
render();updateLabels();
if(allSunk(myShips)){finish(false);return;}
if(!again){turn='p';info(L[lang].yourTurn);return;}
setTimeout(function(){if(id===gameId)aiTurn();},900);
}

function init(){
gameId++;
var mine=placeFleet(),his=placeFleet(),i;
myShips=mine.ships;myGrid=mine.grid;
enShips=his.ships;enGrid=[];
for(i=0;i<SIZE*SIZE;i++)enGrid.push(0);
aiQueue=[];over=false;turn='p';
myCells=buildBoard(document.getElementById('myBoard'));
enCells=buildBoard(document.getElementById('enemyBoard'));
render();updateLabels();
info(L[lang].yourTurn+' | '+L[lang].wins+': '+(localStorage.getItem('stats_bs_wins')||0));
}

document.getElementById('enemyBoard').onclick=function(e){
var el=e.target;
if(!el||el.className.indexOf('cell')<0)return;
var idx=enCells.indexOf(el);
if(idx<0)return;
playerShoot(Math.floor(idx/SIZE),idx%SIZE);
};

document.getElementById('t').textContent=L[lang].t;
document.getElementById('d').textContent=L[lang].d;
document.getElementById('lg').textContent=L[lang].lg;
document.getElementById('bn').textContent=L[lang].bn;
document.getElementById('bb').textContent=L[lang].bb;
document.getElementById('bn').onclick=init;
init();
</script>
</body>
</html>
