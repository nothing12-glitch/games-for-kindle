<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Games for Kindle</title>
    <style>
        body {
            font-family: Georgia, serif;
            font-size: 20px;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 20px 20px 40px;
            line-height: 1.6;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 28px; 
            border-bottom: 2px solid #000; 
            padding-bottom: 10px; 
            margin-bottom: 10px;
        }
        .subtitle {
            font-style: italic;
            color: #666;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 22px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .game-list {
            margin: 20px 0;
        }
        .game-list a {
            display: block;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #000;
            text-decoration: none;
            color: #000;
            font-size: 18px;
            box-shadow: 3px 3px 0px #000;
        }
        .game-list a:active {
            box-shadow: 1px 1px 0px #000;
            transform: translate(2px, 2px);
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #ddd;
            border: 2px solid #000;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 3px 3px 0px #000;
        }
        .back-link:active {
            background: #bbb;
            box-shadow: 1px 1px 0px #000;
        }
        .language-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        .language-selector select {
            padding: 8px;
            font-size: 14px;
            border: 2px solid #000;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>

    <!-- Language Selector -->
    <div class="language-selector">
        <select onchange="changeLanguage(this.value)">
            <option value="en" id="lang-en" selected>English</option>
            <option value="uk" id="lang-uk">Українська</option>
            <option value="de" id="lang-de">Deutsch</option>
            <option value="pl" id="lang-pl">Polski</option>
        </select>
    </div>

    <!-- Main Content -->
    <h1 id="title">Classic Games</h1>
    <p class="subtitle" id="subtitle">Optimized for Kindle with buttons</p>

    <h2 id="quests-title">Text Quests</h2>
    <div class="game-list">
        <a href="lighthouse.html" id="quest1">Lighthouse Mystery - text quest</a>
        <a href="spacestation.html" id="quest2">Space Station - sci-fi quest</a>
        <a href="castle.html" id="quest3">Castle of Shadows - fantasy quest</a>
        <a href="detective.html" id="quest4">Detective Case #47 - detective</a>
    </div>

    <h2 id="other-title">Other Games</h2>
    <div class="game-list">
        <a href="capitals/index.html" id="game1">World Capitals - quiz</a>
        <a href="maze/index.html" id="game2">Maze - adventure game</a>
        <a href="riddles/index.html" id="game3">Book of Riddles - puzzles</a>
    </div>

    <a href="../index.html" class="back-link" id="back-btn">Back to Home</a>

    <script>
        const translations = {
            en: {
                title: "Classic Games",
                subtitle: "Optimized for Kindle with buttons",
                questsTitle: "Text Quests",
                otherTitle: "Other Games",
                back: "Back to Home",
                quest1: "Lighthouse Mystery - text quest",
                quest2: "Space Station - sci-fi quest",
                quest3: "Castle of Shadows - fantasy quest",
                quest4: "Detective Case #47 - detective",
                game1: "World Capitals - quiz",
                game2: "Maze - adventure game",
                game3: "Book of Riddles - puzzles"
            },
            uk: {
                title: "Класичні ігри",
                subtitle: "Оптимізовано для Kindle з кнопками",
                questsTitle: "Текстові квести",
                otherTitle: "Інші ігри",
                back: "На головну",
                quest1: "Таємниця маяка - текстовий квест",
                quest2: "Космічна станція - sci-fi квест",
                quest3: "Замок Тіней - фентезі квест",
                quest4: "Справа №47 - детектив",
                game1: "Столиці світу - вікторина",
                game2: "Лабіринт - пригодницька гра",
                game3: "Книга загадок - головоломки"
            },
            de: {
                title: "Klassische Spiele",
                subtitle: "Optimiert für Kindle mit Tasten",
                questsTitle: "Text-Quests",
                otherTitle: "Andere Spiele",
                back: "Zurück",
                quest1: "Leuchtturm-Mystery - Textquest",
                quest2: "Raumstation - Sci-Fi-Quest",
                quest3: "Schloss der Schatten - Fantasy-Quest",
                quest4: "Detektivfall #47 - Detektiv",
                game1: "Hauptstädte der Welt - Quiz",
                game2: "Labyrinth - Abenteuerspiel",
                game3: "Rätselbuch - Puzzles"
            },
            pl: {
                title: "Gry klasyczne",
                subtitle: "Zoptymalizowane dla Kindle z przyciskami",
                questsTitle: "Questy tekstowe",
                otherTitle: "Inne gry",
                back: "Powrót",
                quest1: "Tajemnica latarni - quest tekstowy",
                quest2: "Stacja kosmiczna - quest sci-fi",
                quest3: "Zamek Cieni - quest fantasy",
                quest4: "Sprawa #47 - detektyw",
                game1: "Stolice świata - quiz",
                game2: "Labirynt - gra przygodowa",
                game3: "Księga zagadek - puzzle"
            }
        };

        function changeLanguage(lang) {
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('subtitle').textContent = translations[lang].subtitle;
            document.getElementById('quests-title').textContent = translations[lang].questsTitle;
            document.getElementById('other-title').textContent = translations[lang].otherTitle;
            document.getElementById('back-btn').textContent = translations[lang].back;
            document.getElementById('quest1').textContent = translations[lang].quest1;
            document.getElementById('quest2').textContent = translations[lang].quest2;
            document.getElementById('quest3').textContent = translations[lang].quest3;
            document.getElementById('quest4').textContent = translations[lang].quest4;
            document.getElementById('game1').textContent = translations[lang].game1;
            document.getElementById('game2').textContent = translations[lang].game2;
            document.getElementById('game3').textContent = translations[lang].game3;
            
            document.getElementById('lang-en').selected = (lang === 'en');
            document.getElementById('lang-uk').selected = (lang === 'uk');
            document.getElementById('lang-de').selected = (lang === 'de');
            document.getElementById('lang-pl').selected = (lang === 'pl');
            
            localStorage.setItem('language', lang);
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('language') || 'en';
            changeLanguage(savedLang);
        };
    </script>
</body>
</html>
