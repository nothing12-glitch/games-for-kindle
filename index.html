<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ігри для Kindle</title>
    <style>
        body {
            font-family: "Georgia", serif;
            font-size: 24px;
            line-height: 1.5;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
        }
        h1 { font-size: 32px; margin-bottom: 10px; }
        p { margin-bottom: 40px; color: #333; }
        
        .version-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 25px;
            font-size: 26px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            text-decoration: none;
            text-align: center;
        }
        .version-btn:focus, .version-btn:hover {
            background: #000;
            color: #fff;
        }
        .hint {
            font-size: 16px;
            color: #555;
            margin-top: 50px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <h1>📚 Kindle Games</h1>
    <p>Оберіть версію сайту, що підходить для вашого пристрою:</p>

    <a href="classic/index.html" class="version-btn">
        📜 Старий Kindle<br>
        <span style="font-size: 18px; font-weight: normal;">(з кнопками, без JavaScript)</span>
    </a>

    <a href="modern/index.html" class="version-btn">
        📱 Новий Kindle<br>
        <span style="font-size: 18px; font-weight: normal;">(сенсорний, з JavaScript)</span>
    </a>

    <div class="hint">
        💡 Порада: Якщо ігри не працюють, увімкніть JavaScript у налаштуваннях браузера Kindle (Menu → Settings → Advanced → Enable JavaScript).
    </div>

</body>
</html>
