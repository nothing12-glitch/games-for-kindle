<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats & Achievements</title>
<style>
body{font-family:Georgia,serif;padding:20px;background:#fff;color:#000;max-width:600px;margin:0 auto;line-height:1.6}
h1{font-size:28px;border-bottom:2px solid #000;padding-bottom:10px}
h2{font-size:20px;margin:28px 0 10px;border-bottom:1px solid #000;padding-bottom:6px}
.rec{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #ddd;font-size:16px}
.rec span{color:#555}
.rec b{font-size:17px;white-space:nowrap}
.rec b.none{color:#999;font-weight:normal}
.ach{margin:12px 0;padding:15px;border:2px solid #000;border-radius:8px}
.ach.ok{background:#e8f5e9}
.ach.no{opacity:.55}
.ach b{display:block;font-size:18px}
.ach span{font-size:15px;color:#555}
a.btn{display:inline-block;margin-top:25px;padding:12px 25px;background:#ddd;border:2px solid #000;text-decoration:none;color:#000;font-weight:bold;border-radius:6px}
</style>
</head>
<body>
<h1 id="t"></h1>
<h2 id="rt"></h2>
<div id="records"></div>
<h2 id="at"></h2>
<div id="list"></div>
<a href="index.html" class="btn" id="bb"></a>

let lang=localStorage.getItem('language')||'en';if(!L[lang])lang='en';
document.documentElement.lang=lang;

function num(k){return +(localStorage.getItem(k)||0);}

const v=num('visits');
const lo=localStorage.getItem('best_lightsout');
const si=num('best_simon');
const c4=num('stats_c4_wins');
const lg=localStorage.getItem('language');
const th=localStorage.getItem('theme');
const ee=localStorage.getItem('egg_found');
const bw=num('stats_bs_wins');
const rv=num('stats_reversi_wins');
const ww=num('stats_wordle_wins');
const mw=num('stats_ms_wins');
const rt=num('best_reaction');
const sn=num('best_snake');
const g2=num('best_2048');
const hw=num('stats_hangman_wins');

const RECORDS=[
['lightsout','best_lightsout'],['simon','best_simon'],['snake','best_snake'],['g2048','best_2048'],
['tetris','best_tetris'],['memory','best_memory'],['puzzle15','best_puzzle15'],['reaction','best_reaction'],
['quiz','best_quiz'],['wordle','best_wordle'],['ms','stats_ms_wins'],['hangman','stats_hangman_wins'],
['c4','stats_c4_wins'],['bs','stats_bs_wins'],['rv','stats_reversi_wins']];

const recEl=document.getElementById('records');
RECORDS.forEach(function(pair){
const val=localStorage.getItem(pair[1]);
const d=document.createElement('div');
d.className='rec';
d.innerHTML='<span>'+L[lang].rec[pair[0]]+'</span>'+(val?'<b>'+val+'</b>':'<b class="none">—</b>');
recEl.appendChild(d);});

const tttW=num('stats_ttt_wins'),tttD=num('stats_ttt_draws'),tttL=num('stats_ttt_losses');
if(tttW+tttD+tttL>0){
const d=document.createElement('div');
d.className='rec';
d.innerHTML='<span>'+L[lang].rec.ttt+'</span><b>'+tttW+' / '+tttD+' / '+tttL+'</b>';
recEl.appendChild(d);}

const conds={a1:v>=1,a2:v>=5,a3:!!lo,a4:si>=5,a5:c4>=1,a6:!!lg&&lg!=='en',a7:th==='dark'||th==='green',a8:!!ee,
a9:bw>=1,a10:rv>=1,a11:ww>=1,a12:mw>=1,a13:rt>0&&rt<300,a14:sn>=10,a15:g2>=512,a16:hw>=5};
const list=document.getElementById('list');
['a1','a2','a3','a4','a5','a6','a7','a8','a9','a10','a11','a12','a13','a14','a15','a16'].forEach(function(k){
const d=document.createElement('div');
d.className='ach '+(conds[k]?'ok':'no');
d.innerHTML='<b>'+(conds[k]?'✓':'✗')+' '+L[lang][k][0]+'</b><span>'+L[lang][k][1]+'</span>';
list.appendChild(d);});
document.getElementById('t').textContent=L[lang].t;
document.getElementById('rt').textContent=L[lang].rt;
document.getElementById('at').textContent=L[lang].at;
document.getElementById('bb').textContent=L[lang].bb;
document.title=L[lang].t;
